# docker-compose.opencode-web.yml
# Deploy OpenCode WEB as a standalone Dokploy application.
# Source: https://github.com/anomalyco/opencode

services:
  opencode-web:
    build:
      context: ..
      dockerfile: ../Dockerfile.opencode-web
      args:
        OPENCODE_VERSION: ${{project.OPENCODE_VERSION}}
    image: opencode-web-custom:latest
    pull_policy: build
    container_name: opencode-web
    restart: unless-stopped
    ports:
      - "${{project.OPENCODE_WEB_PORT}}:${{project.OPENCODE_WEB_PORT}}"
    environment:
      - TZ=${{project.TZ}}
      - OPENCODE_SERVER_USERNAME=${{project.OPENCODE_SERVER_USERNAME}}
      - OPENCODE_SERVER_PASSWORD=${{project.OPENCODE_SERVER_PASSWORD}}
      - OPENCODE_WEB_PORT=${{project.OPENCODE_WEB_PORT}}
      - OPENCODE_WEB_HOSTNAME=${{project.OPENCODE_WEB_HOSTNAME}}
      - OPENCODE_MODEL=${{project.OPENCODE_MODEL}}
      - OPENROUTER_BASE_URL=${{project.OPENROUTER_BASE_URL}}
      - OPENROUTER_API_KEY=${{project.OPENROUTER_API_KEY}}
      - OPENCODE_ZEN_BASE_URL=${{project.OPENCODE_ZEN_BASE_URL}}
      - OPENCODE_ZEN_API_KEY=${{project.OPENCODE_ZEN_API_KEY}}
      - OPENAI_BASE_URL=${{project.OPENAI_BASE_URL}}
      - OPENAI_API_KEY=${{project.OPENAI_API_KEY}}
      - ANTHROPIC_API_KEY=${{project.ANTHROPIC_API_KEY}}
      - FREELLMAPI_BASE_URL=${{project.FREELLMAPI_BASE_URL}}
      - FREELLMAPI_API_KEY=${{project.FREELLMAPI_API_KEY}}
    networks:
      - codeserver-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${{project.OPENCODE_WEB_PORT}}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  codeserver-network:
    external: true
