# docker-compose.opencode-web.yml
# Deploy OpenCode WEB as separate Dokploy application
# Source: https://github.com/anomalyco/opencode

# syntax=docker/compose.yml

services:
  opencode-web:
    build:
      context: ..
      dockerfile: ../Dockerfile.opencode-web
      args:
        OPENCODE_VERSION: ${{project.OPENCODE_VERSION}}
    image: opencode-web-custom:latest
    pull_policy: build
    container_name: opencode-web
    restart: unless-stopped
    ports:
      - "4001:4001"
    volumes:
      - opencode-web-data:/data
      - opencode-web-config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${{project.TZ}}
      - OPENCODE_SERVER_PASSWORD=${{project.OPENCODE_SERVER_PASSWORD}}
      - OPENCODE_SERVER_USERNAME=${{project.OPENCODE_SERVER_USERNAME}}
      - OPENCODE_WEB_PORT=${{project.OPENCODE_WEB_PORT}}
      - OPENCODE_WEB_HOSTNAME=${{project.OPENCODE_WEB_HOSTNAME}}
      - FREELLMAPI_BASE_URL=${{project.FREELLMAPI_BASE_URL}}
      - FREELLMAPI_API_KEY=${{project.FREELLMAPI_API_KEY}}
    networks:
      - codeserver-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  codeserver-network:
    external: true

volumes:
  opencode-web-data:
  opencode-web-config:
