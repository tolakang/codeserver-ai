# docker-compose.rustfs.yml
# Deploy as separate Dokploy application
# Build from official rustfs/rustfs source
# Source: https://github.com/rustfs/rustfs

services:
  rustfs:
    build:
      context: ..
      dockerfile: ../Dockerfile.rustfs
    image: rustfs-custom:latest
    pull_policy: build
    container_name: rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /mnt/storage/rustfs/data:/data
    environment:
      - RUSTFS_ROOT_USER=${{project.RUSTFS_ROOT_USER}}
      - RUSTFS_ROOT_PASSWORD=${{project.RUSTFS_ROOT_PASSWORD}}
      - RUSTFS_VOLUMES=/data
    networks:
      - codeserver-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  codeserver-network:
    external: true
