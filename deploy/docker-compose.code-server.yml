# docker-compose.code-server.yml
# Deploy as separate Dokploy application
# Build from official .deb releases
# Source: https://github.com/coder/code-server

services:
  code-server:
    build:
      context: ..
      dockerfile: ../Dockerfile.codeserver
      args:
        CODESERVER_VERSION: ${{project.CODESERVER_VERSION}}
    image: codeserver-custom:latest
    pull_policy: build
    container_name: code-server
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - code-server-persistent:/workspace
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${{project.TZ}}
      - DEFAULT_WORKSPACE=${{project.CS_DEFAULT_WORKSPACE}}
      - CS_PASSWORD=${{project.CS_PASSWORD}}
      - DEFAULT_PROVIDER=${{project.DEFAULT_PROVIDER}}
      - OPENCODE_MODEL=${{project.OPENCODE_MODEL}}
      - OPENROUTER_BASE_URL=${{project.OPENROUTER_BASE_URL}}
      - OPENROUTER_API_KEY=${{project.OPENROUTER_API_KEY}}
      - OPENCODE_ZEN_BASE_URL=${{project.OPENCODE_ZEN_BASE_URL}}
      - OPENCODE_ZEN_API_KEY=${{project.OPENCODE_ZEN_API_KEY}}
      - FREELLMAPI_BASE_URL=${{project.FREELLMAPI_BASE_URL}}
      - FREELLMAPI_API_KEY=${{project.FREELLMAPI_API_KEY}}
      - ANTHROPIC_API_KEY=${{project.ANTHROPIC_API_KEY}}
      - OPENAI_BASE_URL=${{project.OPENAI_BASE_URL}}
      - OPENAI_API_KEY=${{project.OPENAI_API_KEY}}
      - RUSTFS_ACCESS_KEY=${{project.RUSTFS_ACCESS_KEY}}
      - RUSTFS_SECRET_KEY=${{project.RUSTFS_SECRET_KEY}}
      - RUSTFS_ENDPOINT=${{project.RUSTFS_ENDPOINT}}
      - RUSTFS_BUCKET=${{project.RUSTFS_BUCKET}}
      - ENCRYPTION_KEY=${{project.ENCRYPTION_KEY}}
      - POSTGRES_HOST=${{project.POSTGRES_HOST}}
      - POSTGRES_PORT=${{project.POSTGRES_PORT}}
      - POSTGRES_USER=${{project.GITEA_DB_USER}}
      - POSTGRES_DB=${{project.GITEA_DB_NAME}}
      - POSTGRES_PASSWORD=${{project.POSTGRES_PASSWORD}}
    networks:
      - codeserver-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  codeserver-network:
    external: true

volumes:
  # Fixed volume name keeps /workspace persistent across Dokploy updates.
  code-server-persistent:
    name: codeserver-ai-workspace
