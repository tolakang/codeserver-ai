# docker-compose.code-server.yml
# Deploy as separate Dokploy application
# Build from official .deb releases
# Source: https://github.com/coder/code-server

services:
  code-server:
    build:
      context: .
      dockerfile: Dockerfile.codeserver
      args:
        CODESERVER_VERSION: ${CODESERVER_VERSION:-4.123.0}
    image: codeserver-custom:latest
    container_name: code-server
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - code-server-persistent:/workspace
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - DEFAULT_WORKSPACE=/workspace
      - CS_PASSWORD=${CS_PASSWORD}
      - CODE_SERVER_TLS_CERT=/workspace/config/tls/cert.pem
      - CODE_SERVER_TLS_KEY=/workspace/config/tls/key.pem
    networks:
      - codeserver-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  codeserver-network:
    external: true

volumes:
  code-server-persistent:
