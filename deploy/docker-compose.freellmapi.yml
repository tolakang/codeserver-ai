# docker-compose.freellmapi.yml
# Deploy as separate Dokploy application
# Build from official tashfeenahmed/freellmapi source
# Source: https://github.com/tashfeenahmed/freellmapi

services:
  freellmapi:
    build:
      context: .
      dockerfile: Dockerfile.freellmapi
    image: freellmapi-custom:latest
    container_name: freellmapi
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /mnt/storage/freellmapi/data:/app/server/data
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NIM_API_KEY=${NIM_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENCODE_ZEN_API_KEY=${OPENCODE_ZEN_API_KEY}
    networks:
      - codeserver-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  codeserver-network:
    external: true
