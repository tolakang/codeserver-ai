# docker-compose.freellmapi.yml
# Deploy as separate Dokploy application
# Build from official tashfeenahmed/freellmapi source
# Source: https://github.com/tashfeenahmed/freellmapi

services:
  freellmapi:
    build:
      context: .
      dockerfile: Dockerfile.freellmapi
      args:
        FREELLM_VERSION: ${FREELLM_VERSION:-latest}
    image: freellmapi-custom:latest
    container_name: freellmapi
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - freellmapi-data:/app/server/data
      - freellmapi-config:/app/server/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    networks:
      - codeserver-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  codeserver-network:
    external: true

volumes:
  freellmapi-data:
  freellmapi-config: