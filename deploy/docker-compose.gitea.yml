# docker-compose.gitea.yml
# Deploy as separate Dokploy application
# Build from official go-gitea/gitea source
# Source: https://github.com/go-gitea/gitea

services:
  postgres:
    image: postgres:16-alpine
    container_name: gitea-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=gitea
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - codeserver-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: gitea-pgbouncer
    restart: unless-stopped
    environment:
      - DATABASES_HOST=postgres
      - DATABASES_PORT=5432
      - DATABASES_DBNAME=gitea
      - DATABASES_USER=gitea
      - DATABASES_PASSWORD=${POSTGRES_PASSWORD}
      - PGBOUNCER_AUTH_TYPE=md5
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=100
      - PGBOUNCER_DEFAULT_POOL_SIZE=20
      - PGBOUNCER_MIN_POOL_SIZE=5
      - PGBOUNCER_RESERVE_POOL_SIZE=5
      - PGBOUNCER_RESERVE_POOL_TIMEOUT=5
    ports:
      - "6432:6432"
    networks:
      - codeserver-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "gitea"]
      interval: 10s
      timeout: 5s
      retries: 5

  gitea:
    build:
      context: .
      dockerfile: Dockerfile.gitea
      args:
        GITEA_VERSION: ${GITEA_VERSION:-1.23.0}
    image: gitea-custom:latest
    container_name: gitea
    restart: unless-stopped
    ports:
      - "3001:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=pgbouncer
      - GITEA__database__PORT=6432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD}
      - GITEA__database__SSL_MODE=disable
      - GITEA__database__CONN_POOL_SIZE=10
      - GITEA__server__ROOT_URL=${GITEA_DOMAIN}
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__DOMAIN=${GITEA_DOMAIN}
      - GITEA__service__DISABLE_REGISTRATION=false
    networks:
      - codeserver-network
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  codeserver-network:
    external: true

volumes:
  gitea-data:
  postgres-data:
