# docker-compose.gitea.yml
# Deploy as separate Dokploy application
# Build from official go-gitea/gitea source
# Source: https://github.com/go-gitea/gitea

services:
  postgres:
    image: postgres:16-alpine
    container_name: gitea-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${{project.GITEA_DB_USER}}
      - POSTGRES_PASSWORD=${{project.POSTGRES_PASSWORD}}
      - POSTGRES_DB=${{project.GITEA_DB_NAME}}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - codeserver-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${{project.GITEA_DB_USER}} -d ${{project.GITEA_DB_NAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: gitea-pgbouncer
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${{project.GITEA_DB_NAME}}
      - DB_USER=${{project.GITEA_DB_USER}}
      - DB_PASSWORD=${{project.POSTGRES_PASSWORD}}
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=100
      - DEFAULT_POOL_SIZE=20
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
    networks:
      - codeserver-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${{project.GITEA_DB_USER}}"]
      interval: 10s
      timeout: 5s
      retries: 5

  gitea:
    build:
      context: ..
      dockerfile: ../Dockerfile.gitea
      args:
        GITEA_VERSION: ${{project.GITEA_VERSION}}
    image: gitea-custom:latest
    pull_policy: build
    container_name: gitea
    restart: unless-stopped
    ports:
      - "3001:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=pgbouncer
      - GITEA__database__PORT=6432
      - GITEA__database__NAME=${{project.GITEA_DB_NAME}}
      - GITEA__database__USER=${{project.GITEA_DB_USER}}
      - GITEA__database__PASSWD=${{project.POSTGRES_PASSWORD}}
      - GITEA__database__SSL_MODE=disable
      - GITEA__database__CONN_POOL_SIZE=10
      - GITEA__server__ROOT_URL=${{project.GITEA_ROOT_URL}}
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__DOMAIN=${{project.GITEA_DOMAIN}}
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__REQUIRE_SIGNIN_VIEW=true
      - GITEA__service__DEFAULT_ALLOW_CREATE_REPO=true
      - GITEA__server__LFS_START_SERVER=true
      - GITEA__service__ENABLE_NOTIFY_MAIL=false
    networks:
      - codeserver-network
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  gitea-admin:
    build:
      context: ..
      dockerfile: ../Dockerfile.gitea
      args:
        GITEA_VERSION: ${{project.GITEA_VERSION}}
    image: gitea-custom:latest
    pull_policy: build
    container_name: gitea-admin
    restart: "no"
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA_ADMIN_USER=${{project.GITEA_ADMIN_USER}}
      - GITEA_ADMIN_PASSWORD=${{project.GITEA_ADMIN_PASSWORD}}
      - GITEA_ADMIN_EMAIL=${{project.GITEA_ADMIN_EMAIL}}
    volumes:
      - gitea-data:/data
    networks:
      - codeserver-network
    entrypoint: ["/bin/sh", "-c"]
    command: >
      set -e;
      gitea admin user create
      --username "$${GITEA_ADMIN_USER}"
      --password "$${GITEA_ADMIN_PASSWORD}"
      --email "$${GITEA_ADMIN_EMAIL}"
      --admin
      --must-change-password=false
      || gitea admin user change-password
      --username "$${GITEA_ADMIN_USER}"
      --password "$${GITEA_ADMIN_PASSWORD}";

networks:
  codeserver-network:
    external: true

volumes:
  gitea-data:
  postgres-data:
