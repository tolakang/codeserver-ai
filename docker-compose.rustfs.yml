# docker-compose.rustfs.yml
# Deploy as separate Dokploy application

services:
  rustfs:
    image: ghcr.io/rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /mnt/storage/rustfs/data:/data
    environment:
      - RUSTFS_ROOT_USER=${RUSTFS_ROOT_USER:-admin}
      - RUSTFS_ROOT_PASSWORD=${RUSTFS_ROOT_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
