# docker-compose.yml
# Combined orchestrator - deploys all services together
# For individual service deployment, use files in deploy/ directory

services:
  rustfs:
    extends:
      file: deploy/docker-compose.rustfs.yml
      service: rustfs

  freellmapi:
    extends:
      file: deploy/docker-compose.freellmapi.yml
      service: freellmapi

  gitea:
    extends:
      file: deploy/docker-compose.gitea.yml
      service: gitea

  opencode-web:
    extends:
      file: deploy/docker-compose.opencode-web.yml
      service: opencode-web

  code-server:
    extends:
      file: deploy/docker-compose.code-server.yml
      service: code-server
    depends_on:
      - gitea
      - freellmapi
      - opencode-web
      - rustfs

networks:
  default:
    name: codeserver-network
